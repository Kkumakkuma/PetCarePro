name: Daily Blog Monitor

# 2026-08-21 cron 폐지. 쿠마님 지시(2026-07-27) — 알림은 아침 10시·저녁 22시
# 통합 브리핑 한 통으로만 받는다. 매일 KST 08:50 에 따로 오던 이 알림은 그 지시 위반이었고,
# 판정 기준까지 낡아 매일 "24h 발행 0건" 오탐을 보내고 있었다.
# 블로그 점검 신호는 EC2 briefing.service 가 브리핑 안에 실어 보낸다.
# 이 워크플로는 자세히 들여다볼 때 손으로 돌리는 용도로만 남긴다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily_blog_monitor.py
